<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Játékoskeret — TJ Družstevník Vyškovce nad Ipľom</title>
<link rel="icon" type="image/jpeg" href="assets/logo.jpg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="index.html" class="brand">
    <img src="assets/logo.jpg" alt="TJ Družstevník Vyškovce nad Ipľom címere">
    <div class="txt"><b>Vyškovce nad Ipľom</b><small>TJ Družstevník</small></div>
  </a>
  <button class="menu-toggle" id="menu-toggle">☰ Menü</button>
  <nav id="fo-nav">
    <a href="index.html">Kezdőlap</a>
    <a href="jatekosok.html" class="active">Játékoskeret</a>
    <a href="naptar.html">Meccsek</a>
    <a href="gollovok.html">Góllövőlista</a>
    <a href="eredmenyek.html">Bajnoki tábla</a>
    <a href="fotofeltoltes.html">Fotó feltöltése</a>
  </nav>
</header>

<section style="border-bottom:none; padding-bottom:0;">
  <div class="pennant" style="margin-bottom:18px;">Csapat</div>
  <div class="section-head"><h2>Játékoskeret</h2><span class="hint" id="letszam-hint"></span><div class="bar"></div></div>
  <div class="grid" id="jatekosok-grid">
    <div class="loading-note">Betöltés…</div>
  </div>
</section>

<footer>TJ Družstevník Vyškovce nad Ipľom — © <span id="ev"></span></footer>

<script src="script.js"></script>
<script>
document.getElementById('ev').textContent = new Date().getFullYear();

async function toltsdBeJatekosokat() {
  const grid = document.getElementById('jatekosok-grid');
  try {
    const jatekosok = await apiHivas('alapadatok');
    document.getElementById('letszam-hint').textContent = `${jatekosok.length} fő a keretben`;

    if (!jatekosok.length) {
      grid.innerHTML = '<div class="empty-note">Még nincs feltöltve játékos az Alapadatok fülön.</div>';
      return;
    }

    // Mezszám szerint rendezve — üres/hiányzó szám a lista végére kerül
    jatekosok.sort((a, b) => {
      const an = Number(a.mezSzam), bn = Number(b.mezSzam);
      if (isNaN(an) && isNaN(bn)) return a.nev.localeCompare(b.nev, 'hu');
      if (isNaN(an)) return 1;
      if (isNaN(bn)) return -1;
      return an - bn;
    });

    grid.innerHTML = jatekosok.map(j => {
      const kor = eletkor(j.szuletesiDatum);
      const fotoTartalom = j.foto
        ? `<img src="${esc(j.foto)}" alt="${esc(j.nev)}" loading="lazy">`
        : `<span class="placeholder">${esc(kezdobetuk(j.nev))}</span>`;
      return `
        <div class="player-card fade-in">
          <div class="player-photo">
            ${fotoTartalom}
            ${j.mezSzam ? `<div class="player-number">${esc(j.mezSzam)}</div>` : ''}
          </div>
          <div class="player-info">
            <div class="name">${esc(j.nev)}</div>
            <div class="meta">${kor !== null ? kor + ' éves' : 'életkor n.a.'}</div>
          </div>
        </div>
      `;
    }).join('');
  } catch (err) {
    grid.innerHTML = `<div class="empty-note">Nem sikerült betölteni a játékosokat: ${esc(err.message)}</div>`;
  }
}
toltsdBeJatekosokat();
</script>
</body>
</html>
